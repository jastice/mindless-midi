# Publish the static redirect (.github/pages-redirect/) to GitHub Pages so old
# jastice.github.io/mindless-midi links keep forwarding to Cloudflare Pages.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: GitHub Pages Redirect

on:
  push:
    branches: [main]
    paths:
      - '.github/pages-redirect/**'
      - '.github/workflows/pages-redirect.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-redirect
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Old links keep working: index.html and 404.html both forward to
      # Cloudflare with the path, query and hash intact.
      - name: Collect redirect
        run: |
          mkdir _site
          cp .github/pages-redirect/index.html _site/index.html
          cp .github/pages-redirect/index.html _site/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
