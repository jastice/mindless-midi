# Build and test with Bazel on every push to main and every PR. The real site
# deploys to Cloudflare Pages (cloudflare.yml); the static GitHub Pages
# redirect is published separately by pages-redirect.yml only when it changes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Test
        run: bazel test //...

      - name: Build site
        env:
          # HEAD on pull_request runs is a synthetic merge commit.
          STAMP_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bazel build --config=stamp //site
