# Build and test with Bazel on every push/PR. The real site lives on Cloudflare
# Pages (cloudflare.yml); from main this publishes only a redirect to it on
# GitHub Pages. One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Test
        run: bazel test //...

      - name: Build site
        env:
          # HEAD on pull_request runs is a synthetic merge commit.
          STAMP_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bazel build --config=stamp //site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Old links keep working: index.html and 404.html both forward to
      # Cloudflare with the path, query and hash intact.
      - name: Collect redirect
        run: |
          mkdir _site
          cp .github/pages-redirect/index.html _site/index.html
          cp .github/pages-redirect/index.html _site/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
