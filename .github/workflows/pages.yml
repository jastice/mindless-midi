# Build and test with Bazel on every push/PR; publish //site to GitHub Pages
# from main. One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Test
        run: bazel test //...

      - name: Build site
        run: bazel build //site

      - name: Collect site
        run: |
          site="$(bazel info execution_root)/$(bazel cquery --output=files //site 2>/dev/null)"
          mkdir -p _site
          cp -RL "$site"/. _site/
          chmod -R u+w _site
          ls -la _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
