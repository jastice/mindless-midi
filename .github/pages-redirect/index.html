<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>mindless midi has moved</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://mindless-midi.pages.dev/" />
    <meta http-equiv="refresh" content="0; url=https://mindless-midi.pages.dev/" />
    <script>
      // Served as both index.html and 404.html, so any old deep link lands here.
      // Keep the path below /mindless-midi/, the query (the session) and the hash.
      location.replace(
        "https://mindless-midi.pages.dev/" +
          location.pathname.replace(/^\/mindless-midi\/?/, "") +
          location.search +
          location.hash,
      );
    </script>
  </head>
  <body>
    <p>mindless midi has moved to <a href="https://mindless-midi.pages.dev/">mindless-midi.pages.dev</a>.</p>
  </body>
</html>
